name: Build Windows Application (Tauri v2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install WiX Toolset and NSIS for Windows Installers
        run: |
          choco install wixtoolset nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Populate WiX caches (both WixTools and WixTools314)
          $wixCandidate = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*", "C:\Program Files\WiX Toolset*", "C:\ProgramData\chocolatey\lib\wixtoolset" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixCandidate) {
            $wixDir = $wixCandidate.DirectoryName
            echo $wixDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            foreach ($sub in @("WixTools", "WixTools314")) {
              $dest = "$env:LOCALAPPDATA\tauri\$sub"
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -Path "$wixDir\*" -Destination $dest -Recurse -Force
            }
          }

          # Pre-cache NSIS helper dll with multi-retry
          $nsisPluginDirs = @(
            "$env:LOCALAPPDATA\tauri\NSIS\Plugins\x86-unicode",
            "$env:LOCALAPPDATA\tauri\NSIS\Plugins\x86-unicode\additional"
          )
          foreach ($pDir in $nsisPluginDirs) {
            New-Item -ItemType Directory -Force -Path $pDir | Out-Null
            try {
              curl.exe -fSL --retry 5 --retry-delay 2 -o "$pDir\nsis_tauri_utils.dll" "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
            } catch {}
          }

      - name: Build Tauri Windows Application
        shell: powershell
        run: |
          $buildSuccess = $false
          foreach ($bundle in @("nsis", "msi")) {
            Write-Host "Attempting Tauri build with bundle: $bundle..."
            & npx @tauri-apps/cli build --bundles $bundle
            if ($LASTEXITCODE -eq 0) {
              $buildSuccess = $true
              break
            }
          }
          if (-not $buildSuccess) {
            Write-Host "Bundle build failed, attempting standalone binary build (--no-bundle)..."
            & npx @tauri-apps/cli build --no-bundle
          }

          # Prepare clean distribution folder
          New-Item -ItemType Directory -Force -Path "dist-windows\Installer" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist-windows\Portable" | Out-Null

          # Copy installers (.msi or NSIS setup .exe) with clean, self-describing names
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item -Path $msi.FullName -Destination "dist-windows\Installer\Personal-PDF-Suite-Setup.msi" -Force
            Write-Host "Prepared MSI installer: dist-windows\Installer\Personal-PDF-Suite-Setup.msi"
          }
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item -Path $nsis.FullName -Destination "dist-windows\Installer\Personal-PDF-Suite-Setup.exe" -Force
            Write-Host "Prepared NSIS setup exe: dist-windows\Installer\Personal-PDF-Suite-Setup.exe"
          }

          # Copy portable standalone app into separate Portable folder
          if (Test-Path "src-tauri/target/release/personal-pdf-suite.exe") {
            Copy-Item -Path "src-tauri/target/release/personal-pdf-suite.exe" -Destination "dist-windows\Portable\personal-pdf-suite-portable.exe" -Force
            Write-Host "Prepared Portable executable: dist-windows\Portable\personal-pdf-suite-portable.exe"
          }

      - name: Upload Windows Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Personal-PDF-Suite-Windows
          path: dist-windows/
          if-no-files-found: warn
