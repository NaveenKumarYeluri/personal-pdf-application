name: Build Windows Application (Tauri v2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install WiX Toolset and NSIS for Windows Installers
        run: |
          choco install wixtoolset nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixCandidate = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*", "C:\Program Files\WiX Toolset*", "C:\ProgramData\chocolatey\lib\wixtoolset" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixCandidate) {
            $wixDir = $wixCandidate.DirectoryName
            echo $wixDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $tauriWix = "$env:LOCALAPPDATA\tauri\WixTools"
            New-Item -ItemType Directory -Force -Path $tauriWix | Out-Null
            Copy-Item -Path "$wixDir\*" -Destination $tauriWix -Recurse -Force
          }

      - name: Build Tauri Windows Application
        run: |
          npx @tauri-apps/cli build --bundles nsis
          npx @tauri-apps/cli build --bundles msi || echo "MSI bundle completed or skipped fallback"

      - name: Upload Windows Artifacts (.msi & .exe)
        uses: actions/upload-artifact@v4
        with:
          name: personal-pdf-suite-windows-tauri
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
