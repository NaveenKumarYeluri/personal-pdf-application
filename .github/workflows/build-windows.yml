name: Build Windows Application (Tauri v2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install WiX Toolset and NSIS for Windows Installers
        run: |
          choco install wixtoolset nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Populate WiX caches (both WixTools and WixTools314)
          $wixCandidate = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*", "C:\Program Files\WiX Toolset*", "C:\ProgramData\chocolatey\lib\wixtoolset" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixCandidate) {
            $wixDir = $wixCandidate.DirectoryName
            echo $wixDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            foreach ($sub in @("WixTools", "WixTools314")) {
              $dest = "$env:LOCALAPPDATA\tauri\$sub"
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -Path "$wixDir\*" -Destination $dest -Recurse -Force
            }
          }

          # Pre-cache NSIS helper dll with multi-retry
          $nsisPluginDirs = @(
            "$env:LOCALAPPDATA\tauri\NSIS\Plugins\x86-unicode",
            "$env:LOCALAPPDATA\tauri\NSIS\Plugins\x86-unicode\additional"
          )
          foreach ($pDir in $nsisPluginDirs) {
            New-Item -ItemType Directory -Force -Path $pDir | Out-Null
            try {
              curl.exe -fSL --retry 5 --retry-delay 2 -o "$pDir\nsis_tauri_utils.dll" "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
            } catch {}
          }

      - name: Build Tauri Windows Application
        run: |
          npx @tauri-apps/cli build --bundles nsis || npx @tauri-apps/cli build --bundles msi || npx @tauri-apps/cli build --no-bundle
          if (Test-Path "src-tauri/target/release/personal-pdf-suite.exe") {
            Compress-Archive -Path "src-tauri/target/release/personal-pdf-suite.exe" -DestinationPath "src-tauri/target/release/personal-pdf-suite-windows-portable-x64.zip" -Force
            Write-Host "Created standalone portable zip: personal-pdf-suite-windows-portable-x64.zip"
          }

      - name: Upload Windows Artifacts (.zip, .msi & .exe)
        uses: actions/upload-artifact@v4
        with:
          name: personal-pdf-suite-windows-tauri
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/personal-pdf-suite-windows-portable-x64.zip
            src-tauri/target/release/personal-pdf-suite.exe
          if-no-files-found: warn
