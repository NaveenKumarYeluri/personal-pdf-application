name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Initialize / Sync Android Capacitor Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Provision Gradle Distribution and Configure Extended Timeouts
        run: |
          mkdir -p ~/.gradle /tmp
          printf "%s\n" \
            "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            "org.gradle.parallel=true" \
            "org.gradle.caching=true" \
            "systemProp.org.gradle.internal.http.connectionTimeout=120000" \
            "systemProp.org.gradle.internal.http.socketTimeout=120000" \
            "systemProp.http.socketTimeout=120000" \
            "systemProp.http.connectionTimeout=120000" > ~/.gradle/gradle.properties
          echo "Fetching Gradle distribution with multi-mirror fallback..."
          curl -fSL --retry 3 --connect-timeout 15 -o /tmp/gradle-8.2.1-bin.zip https://services.gradle.org/distributions/gradle-8.2.1-bin.zip || \
          curl -fSL --retry 3 --connect-timeout 15 -o /tmp/gradle-8.2.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip || true
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            if [ -s "/tmp/gradle-8.2.1-bin.zip" ]; then
              echo "Using downloaded local file /tmp/gradle-8.2.1-bin.zip"
              sed -i 's#distributionUrl=.*#distributionUrl=file\\:///tmp/gradle-8.2.1-bin.zip#g' android/gradle/wrapper/gradle-wrapper.properties
            else
              echo "Using high-speed cloud mirror distributionUrl"
              sed -i 's#distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip#g' android/gradle/wrapper/gradle-wrapper.properties
            fi
          fi

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p keystore ~/.android android/app
          if [ -f "keystore/debug.keystore" ]; then
            echo "Using existing repository debug.keystore"
            cp keystore/debug.keystore ~/.android/debug.keystore
            cp keystore/debug.keystore android/app/debug.keystore
          else
            echo "Generating permanent repository debug.keystore"
            keytool -genkeypair -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Personal PDF Suite,C=US"
            cp keystore/debug.keystore ~/.android/debug.keystore
            cp keystore/debug.keystore android/app/debug.keystore
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add keystore/debug.keystore
              git commit -m "chore: persist static Android signing debug keystore for seamless updates [skip ci]" || true
              git push origin HEAD:main || true
            fi
          fi

      - name: Configure Deterministic Android Signing & Versioning
        run: |
          # 1. Update versionCode and versionName
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

          # 2. Inject explicit debug signing config into app/build.gradle
          python3 scripts/configure_android_signing.py

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-pdf-suite-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
